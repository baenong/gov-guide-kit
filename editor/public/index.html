<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>가이드 에디터</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="editor-layout">
      <aside class="editor-sidebar">
        <button type="button" id="new-page-button">새 페이지</button>
        <ul id="page-list"></ul>
      </aside>
      <main class="editor-main">
        <label>제목 <input type="text" id="page-title" /></label>
        <label>설명 <input type="text" id="page-description" /></label>
        <div id="toolbar">
          <button type="button" data-snippet="h2">중제목</button>
          <button type="button" data-snippet="h3">소제목</button>
          <button type="button" data-snippet="notice">공지</button>
          <button type="button" data-snippet="warning">주의</button>
          <button type="button" data-snippet="calendar">캘린더</button>
          <button type="button" data-snippet="orderedList">순서 목록</button>
          <button type="button" data-snippet="unorderedList">목록</button>
          <button type="button" id="page-link-button">페이지 링크</button>
          <button type="button" id="image-button">이미지</button>
          <button type="button" id="attachment-button">첨부파일</button>
        </div>
        <textarea id="page-body" rows="20"></textarea>
        <button type="button" id="save-button">저장</button>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
